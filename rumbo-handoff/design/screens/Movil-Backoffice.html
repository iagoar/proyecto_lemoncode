<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Backoffice (móvil) — rumbo.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2c5af5}a:hover{color:#16181d}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2c5af5;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #f2f4f8; font-family: Geist, system-ui, sans-serif; color: #16181d; font-size: 15px; line-height: 24px; display: flex; flex-direction: column; overflow: hidden">
  <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
    <header style="flex: none; background: #ffffff; border-bottom: 1px solid #dde1e8; padding: 44px 8px 10px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 4px">
        <button type="button" onClick="{{openDrawer}}" aria-label="Abrir menú" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
        <img src="/_blob/a0ab3f6c53629b5b3f24b55c9fceb08e" alt="rumbo." style="width: 86px; height: 24px">
        <span style="background: #16181d; color: #ffffff; border-radius: 6px; padding: 0 6px; font-family: 'Geist Mono', monospace; font-size: 10px; line-height: 18px; font-weight: 600; letter-spacing: 0.08em; margin-left: 4px">ADMIN</span>
      </div>
    </header>
    <main style="flex: 1; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Servicios</h1>
        <p style="margin: 0; color: #5b6170; font-size: 14px; line-height: 20px">6 servicios · 5 publicados</p>
      </div>
      <div style="position: relative">
        <label for="mb-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar servicio</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="mb-q" type="search" placeholder="Buscar servicio…" style="width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px 0 40px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d">
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; background: #ffffff; border: 1px solid #dde1e8; border-radius: 16px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <li style="{{r.rowStyle}}">
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">{{r.name}}</span>
              <span style="font-size: 13px; line-height: 18px; color: #5b6170">{{r.cat}} · <span style="font-family: 'Geist Mono', monospace">{{r.dur}} · XX €</span></span>
              <span style="{{r.badge}}">{{r.status}}</span>
            </div>
            <button type="button" onClick="{{r.edit}}" aria-label="{{r.editLabel}}" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 10px; background: transparent; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
          </li>
        </sc-for>
      </ul>
    </main>
    <div style="flex: none; padding: 12px 16px 28px; background: #ffffff; border-top: 1px solid #dde1e8">
      <button type="button" onClick="{{newOne}}" style="width: 100%; min-height: 52px; border: 0; border-radius: 10px; background: #2c5af5; color: #ffffff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Nuevo servicio</button>
    </div>
  </sc-if>

  <sc-if value="{{isForm}}" hint-placeholder-val="{{ false }}">
    <header style="flex: none; background: #ffffff; border-bottom: 1px solid #dde1e8; padding: 44px 8px 10px; display: flex; align-items: center; gap: 4px">
      <button type="button" onClick="{{toList}}" aria-label="Cerrar formulario" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 18px; line-height: 24px; font-weight: 600">{{formTitle}}</h1>
    </header>
    <main style="flex: 1; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="mb-name" style="font-size: 14px; line-height: 20px; font-weight: 500">Nombre</label>
        <input id="mb-name" type="text" value="{{fName}}" placeholder="Ej. Coaching ejecutivo" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="mb-cat" style="font-size: 14px; line-height: 20px; font-weight: 500">Categoría</label>
        <select id="mb-cat" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d"><option>{{fCat}}</option><option>Coaching</option><option>Bienestar</option><option>Formación</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="mb-desc" style="font-size: 14px; line-height: 20px; font-weight: 500">Descripción</label>
        <textarea id="mb-desc" rows="4" placeholder="Qué incluye y para quién es" style="border: 1px solid #8a91a0; border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 16px; resize: vertical; color: #16181d"></textarea>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mb-dur" style="font-size: 14px; line-height: 20px; font-weight: 500">Duración (min)</label>
          <input id="mb-dur" type="number" placeholder="60" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 14px; font: inherit; font-family: 'Geist Mono', monospace; font-size: 16px; min-width: 0; background: #ffffff">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="mb-price" style="font-size: 14px; line-height: 20px; font-weight: 500">Precio (€)</label>
          <input id="mb-price" type="text" inputmode="decimal" placeholder="0,00" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 14px; font: inherit; font-family: 'Geist Mono', monospace; font-size: 16px; min-width: 0; background: #ffffff">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="mb-mode" style="font-size: 14px; line-height: 20px; font-weight: 500">Modalidad</label>
        <select id="mb-mode" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d"><option>Online</option><option>Presencial</option></select>
      </div>
      <button type="button" style="min-height: 88px; border: 1px dashed #8a91a0; border-radius: 12px; background: #ffffff; font: inherit; font-size: 14px; color: #5b6170; cursor: pointer">Subir imagen del servicio</button>
      <button type="button" role="switch" aria-checked="{{pubOn}}" onClick="{{togglePub}}" style="min-height: 52px; padding: 0 14px; border: 1px solid #dde1e8; border-radius: 12px; background: #ffffff; font: inherit; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left">
        Publicado (visible para clientes)
        <span aria-hidden="true" style="{{switchTrack}}"><span style="width: 20px; height: 20px; border-radius: 9999px; background: #ffffff; box-shadow: 0 1px 2px rgba(22,24,29,0.2)"></span></span>
      </button>
      <sc-if value="{{isEditing}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{askDel}}" style="min-height: 48px; border: 1px solid #d92d20; border-radius: 10px; background: #ffffff; color: #d92d20; font: inherit; font-weight: 500; cursor: pointer">Eliminar servicio</button>
      </sc-if>
    </main>
    <div style="flex: none; padding: 12px 16px 28px; background: #ffffff; border-top: 1px solid #dde1e8; display: flex; gap: 8px">
      <button type="button" onClick="{{toList}}" style="flex: 1; min-height: 52px; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; font: inherit; font-weight: 500; cursor: pointer">Descartar</button>
      <button type="button" onClick="{{toList}}" style="flex: 2; min-height: 52px; border: 0; border-radius: 10px; background: #2c5af5; color: #ffffff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer">Guardar</button>
    </div>
  </sc-if>

  <sc-if value="{{drawer}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(22,24,29,0.5); display: flex">
      <nav aria-label="Backoffice" style="width: 280px; height: 100%; background: #ffffff; padding: 52px 12px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 16px 8px">
          <img src="/_blob/a0ab3f6c53629b5b3f24b55c9fceb08e" alt="rumbo." style="width: 93px; height: 26px">
          <button type="button" onClick="{{closeDrawer}}" aria-label="Cerrar menú" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <a href="Movil-Backoffice.dc.html" aria-current="page" style="min-height: 48px; padding: 0 12px; border-radius: 10px; background: #ebf0ff; color: #16181d; text-decoration: none; display: flex; align-items: center; font-weight: 600">Servicios</a>
        <a href="#" style="min-height: 48px; padding: 0 12px; border-radius: 10px; color: #5b6170; text-decoration: none; display: flex; align-items: center; font-weight: 500">Reservas</a>
        <a href="#" style="min-height: 48px; padding: 0 12px; border-radius: 10px; color: #5b6170; text-decoration: none; display: flex; align-items: center; font-weight: 500">Profesionales</a>
        <a href="#" style="min-height: 48px; padding: 0 12px; border-radius: 10px; color: #5b6170; text-decoration: none; display: flex; align-items: center; font-weight: 500">Clientes</a>
        <a href="#" style="min-height: 48px; padding: 0 12px; border-radius: 10px; color: #5b6170; text-decoration: none; display: flex; align-items: center; font-weight: 500">Ajustes</a>
        <a href="Movil-Login.dc.html" style="margin-top: auto; min-height: 48px; padding: 0 12px; border-radius: 10px; color: #5b6170; text-decoration: none; display: flex; align-items: center; font-weight: 500">Cerrar sesión</a>
      </nav>
      <button type="button" onClick="{{closeDrawer}}" aria-label="Cerrar menú" style="flex: 1; border: 0; background: transparent; cursor: pointer"></button>
    </div>
  </sc-if>

  <sc-if value="{{confirming}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(22,24,29,0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div role="dialog" aria-modal="true" aria-labelledby="mb-del" style="background: #ffffff; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 12px">
        <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #dde1e8"></div>
        <h2 id="mb-del" style="margin: 8px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">¿Eliminar «{{fName}}»?</h2>
        <p style="margin: 0; color: #5b6170">Se quitará del catálogo. Las reservas ya hechas no se cancelan automáticamente.</p>
        <button type="button" onClick="{{doDel}}" style="min-height: 52px; border: 0; border-radius: 10px; background: #d92d20; color: #ffffff; font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; margin-top: 8px">Eliminar</button>
        <button type="button" onClick="{{closeDel}}" style="min-height: 52px; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; font: inherit; font-weight: 500; font-size: 16px; cursor: pointer">Cancelar</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'list', editing: null, pub: true, drawer: false, deleting: false };
  }
  renderVals() {
    const data = [
      { name: 'Coaching ejecutivo', cat: 'Coaching', dur: '60 min', pub: true },
      { name: 'Coaching de carrera', cat: 'Coaching', dur: '45 min', pub: true },
      { name: 'Hablar en público', cat: 'Formación', dur: '90 min', pub: true },
      { name: 'Mindfulness inicial', cat: 'Bienestar', dur: '60 min', pub: true },
      { name: 'Asesoría nutricional', cat: 'Bienestar', dur: '45 min', pub: false },
      { name: 'Mentoría de producto', cat: 'Formación', dur: '60 min', pub: true }
    ];
    const rows = data.map((d, i) => ({
      ...d,
      status: d.pub ? 'Publicado' : 'Borrador',
      badge: 'align-self: flex-start; margin-top: 4px; display: inline-flex; padding: 0 8px; border-radius: 9999px; font-size: 12px; line-height: 20px; font-weight: 500; ' + (d.pub ? 'background: #ebf0ff; color: #16181d' : 'background: #ffffff; color: #5b6170; border: 1px dashed #8a91a0'),
      rowStyle: 'display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; ' + (i > 0 ? 'border-top: 1px solid #dde1e8' : ''),
      editLabel: 'Editar ' + d.name,
      edit: () => this.setState({ view: 'form', editing: i, pub: d.pub })
    }));
    const cur = this.state.editing === null ? null : data[this.state.editing];
    const on = this.state.pub;
    return {
      rows,
      isList: this.state.view === 'list',
      isForm: this.state.view === 'form',
      isEditing: !!cur,
      formTitle: cur ? 'Editar servicio' : 'Nuevo servicio',
      fName: cur ? cur.name : '',
      fCat: cur ? cur.cat : 'Seleccionar',
      newOne: () => this.setState({ view: 'form', editing: null, pub: false }),
      toList: () => this.setState({ view: 'list' }),
      pubOn: on ? 'true' : 'false',
      togglePub: () => this.setState({ pub: !on }),
      switchTrack: 'width: 40px; height: 24px; border-radius: 9999px; padding: 2px; box-sizing: border-box; flex: none; display: flex; ' + (on ? 'background: #2c5af5; justify-content: flex-end' : 'background: #8a91a0; justify-content: flex-start'),
      drawer: this.state.drawer,
      openDrawer: () => this.setState({ drawer: true }),
      closeDrawer: () => this.setState({ drawer: false }),
      confirming: this.state.deleting,
      askDel: () => this.setState({ deleting: true }),
      closeDel: () => this.setState({ deleting: false }),
      doDel: () => this.setState({ deleting: false, view: 'list', editing: null })
    };
  }
}
</script>
</body>
</html>
