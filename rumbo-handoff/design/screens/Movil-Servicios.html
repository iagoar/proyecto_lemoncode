<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catálogo (móvil) — rumbo.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2c5af5}a:hover{color:#16181d}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2c5af5;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #f2f4f8; font-family: Geist, system-ui, sans-serif; color: #16181d; font-size: 15px; line-height: 24px; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; background: #ffffff; border-bottom: 1px solid #dde1e8; padding: 44px 16px 10px; display: flex; align-items: center; justify-content: space-between">
    <img src="/_blob/a0ab3f6c53629b5b3f24b55c9fceb08e" alt="rumbo." style="width: 93px; height: 26px">
    <button type="button" aria-label="Tu cuenta" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9999px; background: #16181d; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">US</span></button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">Encuentra tu servicio</h1>
      <p style="margin: 0; color: #5b6170; font-size: 14px; line-height: 20px">Coaching, bienestar y formación.</p>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex: 1; position: relative">
        <label for="m-buscar" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input id="m-buscar" type="search" placeholder="Servicio o profesional" style="width: 100%; box-sizing: border-box; height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px 0 40px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d">
      </div>
      <button type="button" onClick="{{openSheet}}" aria-label="Filtros" style="width: 48px; height: 48px; flex: none; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
    </div>
    <div role="group" aria-label="Categorías" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 18px; color: #5b6170">{{count}} servicios</p>
    <sc-for list="{{shown}}" as="s" hint-placeholder-count="4">
      <a href="Movil-Detalle.dc.html" style="background: #ffffff; border: 1px solid #dde1e8; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; text-decoration: none; color: #16181d">
        <span style="{{s.media}}">
          <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2c5af5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
          <span style="position: absolute; top: 10px; left: 10px; background: #ffffff; border-radius: 9999px; padding: 0 10px; font-size: 12px; line-height: 22px; font-weight: 500">{{s.cat}}</span>
        </span>
        <span style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; line-height: 24px; font-weight: 600">{{s.name}}</span>
          <span style="font-size: 14px; line-height: 20px; color: #5b6170">{{s.mode}} · con [Profesional]</span>
          <span style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px">
            <span style="font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500">{{s.dur}} · XX €</span>
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
          </span>
        </span>
      </a>
    </sc-for>
  </main>

  <nav aria-label="Principal" style="flex: none; background: #ffffff; border-top: 1px solid #dde1e8; padding: 6px 8px 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Movil-Servicios.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #2c5af5; font-size: 12px; line-height: 16px; font-weight: 600"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Servicios</a>
    <a href="Movil-MisReservas.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5b6170; font-size: 12px; line-height: 16px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"></path></svg>Mis reservas</a>
    <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5b6170; font-size: 12px; line-height: 16px; font-weight: 500"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Perfil</a>
  </nav>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(22,24,29,0.5); display: flex; flex-direction: column; justify-content: flex-end">
      <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="background: #ffffff; border-radius: 24px 24px 0 0; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 16px">
        <div aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 9999px; background: #dde1e8"></div>
        <div style="display: flex; justify-content: space-between; align-items: center">
          <h2 id="sheet-title" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Filtros</h2>
          <button type="button" onClick="{{closeSheet}}" aria-label="Cerrar filtros" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="m-mod" style="font-size: 14px; line-height: 20px; font-weight: 500">Modalidad</label>
          <select id="m-mod" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d"><option>Todas</option><option>Online</option><option>Presencial</option></select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="m-ord" style="font-size: 14px; line-height: 20px; font-weight: 500">Ordenar por</label>
          <select id="m-ord" style="height: 48px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; background: #ffffff; color: #16181d"><option>Relevancia</option><option>Precio: menor a mayor</option><option>Precio: mayor a menor</option><option>Duración</option></select>
        </div>
        <div style="display: flex; gap: 8px; padding-top: 4px">
          <button type="button" onClick="{{closeSheet}}" style="flex: 1; min-height: 48px; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; font: inherit; font-weight: 500; cursor: pointer">Limpiar</button>
          <button type="button" onClick="{{closeSheet}}" style="flex: 2; min-height: 48px; border: 0; border-radius: 10px; background: #2c5af5; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer">Ver resultados</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Todos', sheet: false };
  }
  renderVals() {
    const ICON = {
      Coaching: 'M3 11 22 2 13 21 11 13 3 11Z',
      Bienestar: 'M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10ZM2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12',
      'Formación': 'M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5'
    };
    const TINT = { Coaching: '#c9d6ff', Bienestar: '#ebf0ff', 'Formación': '#dde1e8' };
    const services = [
      { name: 'Coaching ejecutivo', cat: 'Coaching', dur: '60 min', mode: 'Online' },
      { name: 'Coaching de carrera', cat: 'Coaching', dur: '45 min', mode: 'Online' },
      { name: 'Hablar en público', cat: 'Formación', dur: '90 min', mode: 'Presencial' },
      { name: 'Mindfulness inicial', cat: 'Bienestar', dur: '60 min', mode: 'Online' },
      { name: 'Asesoría nutricional', cat: 'Bienestar', dur: '45 min', mode: 'Presencial' },
      { name: 'Mentoría de producto', cat: 'Formación', dur: '60 min', mode: 'Online' }
    ];
    const selected = this.state.cat;
    const cats = ['Todos', 'Coaching', 'Bienestar', 'Formación'].map((label) => {
      const on = label === selected;
      return {
        label,
        on: on ? 'true' : 'false',
        pick: () => this.setState({ cat: label }),
        style: 'flex: none; min-height: 40px; padding: 0 16px; border-radius: 9999px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #16181d; color: #ffffff; border: 1px solid #16181d' : 'background: #ffffff; color: #16181d; border: 1px solid #8a91a0')
      };
    });
    const list = selected === 'Todos' ? services : services.filter((s) => s.cat === selected);
    const shown = list.map((s) => ({
      ...s,
      icon: ICON[s.cat],
      media: 'position: relative; height: 140px; background: ' + TINT[s.cat] + '; display: flex; align-items: center; justify-content: center'
    }));
    return {
      cats,
      shown,
      count: shown.length,
      sheet: this.state.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>
