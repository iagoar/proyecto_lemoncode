<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catálogo de servicios — rumbo.</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2c5af5}a:hover{color:#16181d}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2c5af5;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 1480px; background: #f2f4f8; font-family: Geist, system-ui, sans-serif; color: #16181d; font-size: 15px; line-height: 24px">
  <header style="background: #ffffff; border-bottom: 1px solid #dde1e8">
    <div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 32px; flex-wrap: wrap">
        <a href="Servicios.dc.html" aria-label="rumbo. — inicio" style="display: flex; align-items: center; min-height: 44px"><img src="/_blob/a0ab3f6c53629b5b3f24b55c9fceb08e" alt="rumbo." style="width: 107px; height: 30px"></a>
        <nav aria-label="Principal" style="display: flex; gap: 4px; flex-wrap: wrap">
          <a href="Servicios.dc.html" aria-current="page" style="min-height: 40px; padding: 0 14px; border-radius: 10px; background: #ebf0ff; color: #16181d; font-weight: 600; font-size: 14px; text-decoration: none; display: flex; align-items: center">Servicios</a>
          <a href="MisReservas.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 10px; color: #5b6170; font-weight: 500; font-size: 14px; text-decoration: none; display: flex; align-items: center">Mis reservas</a>
        </nav>
      </div>
      <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 4px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #16181d; cursor: pointer">
        <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 9999px; background: #16181d; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">US</span>
        [Nombre usuario]
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #5b6170">Catálogo</p>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 36px; line-height: 40px; font-weight: 700; letter-spacing: -0.015em">Encuentra tu servicio</h1>
      <p style="margin: 0; color: #5b6170; font-size: 17px; line-height: 26px">Coaching, bienestar y formación con profesionales verificados.</p>
    </div>

    <div style="background: #ffffff; border: 1px solid #dde1e8; border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px">
        <label for="buscar" style="font-size: 14px; line-height: 20px; font-weight: 500">Buscar</label>
        <div style="position: relative">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6170" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <input id="buscar" type="search" placeholder="Servicio o profesional" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 14px 0 42px; font: inherit; font-size: 15px; background: #ffffff; color: #16181d">
        </div>
      </div>
      <div style="flex: 0 1 200px; display: flex; flex-direction: column; gap: 6px">
        <label for="modalidad" style="font-size: 14px; line-height: 20px; font-weight: 500">Modalidad</label>
        <select id="modalidad" style="height: 44px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; background: #ffffff; color: #16181d">
          <option>Todas</option><option>Online</option><option>Presencial</option>
        </select>
      </div>
      <div style="flex: 0 1 200px; display: flex; flex-direction: column; gap: 6px">
        <label for="orden" style="font-size: 14px; line-height: 20px; font-weight: 500">Ordenar por</label>
        <select id="orden" style="height: 44px; border: 1px solid #8a91a0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; background: #ffffff; color: #16181d">
          <option>Relevancia</option><option>Precio: menor a mayor</option><option>Precio: mayor a menor</option><option>Duración</option>
        </select>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
      <div role="group" aria-label="Categorías" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b6170">{{count}} servicios</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px">
      <sc-for list="{{shown}}" as="s" hint-placeholder-count="6">
        <article style="background: #ffffff; border: 1px solid #dde1e8; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
          <div style="{{s.media}}">
            <svg aria-hidden="true" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2c5af5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
            <span style="position: absolute; top: 12px; left: 12px; background: #ffffff; color: #16181d; border-radius: 9999px; padding: 2px 10px; font-size: 12px; line-height: 20px; font-weight: 500">{{s.cat}}</span>
          </div>
          <div style="padding: 20px; display: flex; flex-direction: column; gap: 8px; flex: 1">
            <h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">{{s.name}}</h2>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b6170; display: flex; align-items: center; gap: 6px">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.modeIcon}}"></path></svg>
              {{s.mode}} · con [Profesional]
            </p>
            <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5b6170">{{s.blurb}}</p>
            <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #dde1e8; display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <span style="font-family: 'Geist Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500">{{s.dur}} · XX €</span>
              <a href="Detalle.dc.html" style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #8a91a0; background: #ffffff; color: #16181d; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px">Ver detalle
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
              </a>
            </div>
          </div>
        </article>
      </sc-for>
    </div>

    <nav aria-label="Paginación" style="display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding-top: 8px">
      <button type="button" aria-label="Página anterior" style="width: 44px; height: 44px; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></button>
      <button type="button" aria-current="page" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #16181d; color: #ffffff; font: inherit; font-family: 'Geist Mono', monospace; font-weight: 500; cursor: pointer">1</button>
      <button type="button" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; font: inherit; font-family: 'Geist Mono', monospace; cursor: pointer">2</button>
      <button type="button" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #16181d; font: inherit; font-family: 'Geist Mono', monospace; cursor: pointer">3</button>
      <button type="button" aria-label="Página siguiente" style="width: 44px; height: 44px; border: 1px solid #8a91a0; border-radius: 10px; background: #ffffff; color: #16181d; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
    </nav>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'Todos' };
  }
  renderVals() {
    const ICON = {
      Coaching: 'M3 11 22 2 13 21 11 13 3 11Z',
      Bienestar: 'M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10ZM2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12',
      'Formación': 'M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5'
    };
    const TINT = { Coaching: '#c9d6ff', Bienestar: '#ebf0ff', 'Formación': '#dde1e8' };
    const MODE = {
      Online: 'm16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 10.5M4 6h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z',
      Presencial: 'M20 10c0 5-8 12-8 12s-8-7-8-12a8 8 0 0 1 16 0ZM15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0'
    };
    const services = [
      { name: 'Coaching ejecutivo', cat: 'Coaching', dur: '60 min', mode: 'Online', blurb: 'Liderazgo, decisiones y gestión de equipos.' },
      { name: 'Coaching de carrera', cat: 'Coaching', dur: '45 min', mode: 'Online', blurb: 'Cambio de rol, búsqueda de empleo y marca personal.' },
      { name: 'Hablar en público', cat: 'Formación', dur: '90 min', mode: 'Presencial', blurb: 'Estructura, voz y gestión de nervios.' },
      { name: 'Mindfulness inicial', cat: 'Bienestar', dur: '60 min', mode: 'Online', blurb: 'Primeros pasos en atención plena.' },
      { name: 'Asesoría nutricional', cat: 'Bienestar', dur: '45 min', mode: 'Presencial', blurb: 'Hábitos y planificación de comidas.' },
      { name: 'Mentoría de producto', cat: 'Formación', dur: '60 min', mode: 'Online', blurb: 'Discovery, roadmap y priorización.' }
    ];
    const selected = this.state.cat;
    const cats = ['Todos', 'Coaching', 'Bienestar', 'Formación'].map((label) => {
      const on = label === selected;
      return {
        label,
        on: on ? 'true' : 'false',
        pick: () => this.setState({ cat: label }),
        style: 'min-height: 40px; padding: 0 16px; border-radius: 9999px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; ' + (on ? 'background: #16181d; color: #ffffff; border: 1px solid #16181d' : 'background: #ffffff; color: #16181d; border: 1px solid #8a91a0')
      };
    });
    const list = selected === 'Todos' ? services : services.filter((s) => s.cat === selected);
    const shown = list.map((s) => ({
      ...s,
      icon: ICON[s.cat],
      modeIcon: MODE[s.mode],
      media: 'position: relative; aspect-ratio: 16 / 9; background: ' + TINT[s.cat] + '; display: flex; align-items: center; justify-content: center'
    }));
    return { cats, shown, count: shown.length };
  }
}
</script>
</body>
</html>
